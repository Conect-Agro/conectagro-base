<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registrarse</title>
    <link rel="icon" type="image/png" href="assets/logo.png" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <script src="register.js" defer></script>
  </head>
  <body>
    <main>
      <div class="form-container">
        <h1>Registrarse</h1>
        <form id="register-form">
          <label for="first_name_person" class="sr-only">Nombre</label>
          <input
            type="text"
            name="first_name_person"
            id="first_name_person"
            placeholder="Ingresa tu nombre"
            required
          />
          <label for="last_name_person" class="sr-only">Apellido</label>
          <input
            type="text"
            name="last_name_person"
            id="last_name_person"
            placeholder="Ingresa tu Apellido"
            required
          />
          <label for="document_number_person" class="sr-only">Documento</label>
          <input
            type="text"
            name="document_number_person"
            id="document_number_person"
            placeholder="Ingresa tu numero de documento"
            required pattern="\d+" title="Only numbers are allowed" title="Solo números" maxlength="10"
          />
          <label for="user_name" class="sr-only">Usuario</label>
          <input
            type="text"
            name="user_name"
            id="user_name"
            placeholder="Ingresa tu usuario"
          />
          <label for="email_user" class="sr-only">Correo</label>
          <input
            type="email"
            name="email_user"
            id="email_user"
            placeholder="Ingresa tu correo"
          />
          <label for="password" class="sr-only">Contraseña</label>
          <input
            type="password"
            name="password"
            id="password"
            placeholder="Ingresa tu contraseña"
            required
          />
          
          <!-- Campos adicionales para productores -->
          <div id="producer-fields" class="hidden">
            <h3 class="section-title">
              <i class="fas fa-seedling"></i> Información del Productor
            </h3>
            
            <div class="input-group">
              <label for="farm_name" class="sr-only">Nombre de la Finca</label>
              <div class="input-wrapper">
                <i class="fas fa-tractor input-icon"></i>
                <input
                  type="text"
                  name="farm_name"
                  id="farm_name"
                  placeholder="Nombre de tu finca"
                />
              </div>
            </div>
            
            <div class="input-group">
              <label for="nit" class="sr-only">NIT</label>
              <div class="input-wrapper">
                <i class="fas fa-id-card input-icon"></i>
                <input
                  type="text"
                  name="nit"
                  id="nit"
                  placeholder="NIT (Opcional)"
                />
              </div>
            </div>
            
            <div class="input-group">
              <label for="location" class="sr-only">Ubicación</label>
              <div class="input-wrapper">
                <i class="fas fa-map-marker-alt input-icon"></i>
                <input
                  type="text"
                  name="location"
                  id="location"
                  placeholder="Ubicación de la finca (Ciudad, Vereda)"
                />
              </div>
            </div>
            
            <div class="input-group">
              <label for="farm_size" class="sr-only">Tamaño de la Finca</label>
              <div class="input-wrapper">
                <i class="fas fa-ruler-combined input-icon"></i>
                <input
                  type="number"
                  step="0.01"
                  name="farm_size"
                  id="farm_size"
                  placeholder="Tamaño de la finca (m²)"
                />
              </div>
            </div>
            
            <div class="input-group">
              <label for="production_type_id" class="sr-only">Tipo de Producción</label>
              <div class="input-wrapper">
                <i class="fas fa-leaf input-icon"></i>
                <select name="production_type_id" id="production_type_id">
                  <option value="">Selecciona tipo de producción</option>
                  <!-- Las opciones se cargarán dinámicamente desde la API -->
                </select>
              </div>
            </div>
            
            <div class="input-group">
              <label for="contact_phone" class="sr-only">Teléfono de Contacto</label>
              <div class="input-wrapper">
                <i class="fas fa-phone input-icon"></i>
                <input
                  type="tel"
                  name="contact_phone"
                  id="contact_phone"
                  placeholder="Teléfono de contacto"
                />
              </div>
            </div>
            
            <div class="input-group">
              <label for="contact_email" class="sr-only">Email de Contacto</label>
              <div class="input-wrapper">
                <i class="fas fa-envelope input-icon"></i>
                <input
                  type="email"
                  name="contact_email"
                  id="contact_email"
                  placeholder="Email de contacto (puede ser el mismo)"
                />
              </div>
            </div>
          </div>
          
          <div class="container-button">
            <button type="submit">
              Registrarse
              <div class="arrow-wrapper">
                <div class="arrow"></div>
              </div>
            </button>
          </div>
            <p class="error hidden">Error al Registrarse, intentelo de nuevo.</p>
          <p class="account-text">Ya tienes una cuenta? - <a href="/">Ingresar</a></p>
        </form>
      </div>
    </main>
  </body>
</html>
